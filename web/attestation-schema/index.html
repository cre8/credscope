<!doctype html>
<html lang="en">
  <head>
    <!-- inspector:head -->
  </head>
  <body>
    <!-- inspector:header -->

    <main>
      <section class="panel input" id="input-panel">
        <!-- inspector:fetch -->
        <form id="input-form">
          <!-- inspector:document -->
          <fieldset class="options">
            <legend>Signature and references</legend>
            <div class="field">
              <label class="field-label" for="key">Signer key <span class="optional">optional</span></label>
              <p class="help" id="key-help">For a SchemaMeta as JWS: a JWK, a JWK Set, or certificates as PEM. Without it, the signature is verified with the x5c of the header; give the certificate of a trust anchor to check the x5c chain as well.</p>
              <textarea id="key" name="key" class="short" spellcheck="false" aria-describedby="key-help" placeholder="{&quot;kty&quot;: …} or -----BEGIN CERTIFICATE-----"></textarea>
            </div>
            <label class="check">
              <input type="checkbox" id="references" name="references" value="1" />
              <span>Fetch the rulebook and the schemas the SchemaMeta references, and check them against their integrity.
              The fetch proxy fetches them where their servers do not allow the page to.</span>
            </label>
          </fieldset>
          <!-- inspector:actions -->
        </form>
      </section>

      <!-- inspector:result -->
    </main>

    <!-- inspector:footer -->
    <script type="module" src="/src/pages/attestation-schema.ts"></script>
  </body>
</html>
