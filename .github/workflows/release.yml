name: Release the executable

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ASSET: credscope-linux-x64

jobs:
  binary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: credscope
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: credscope
          persist-credentials: false

      # Single executables of Node.js are built with node --build-sea, which needs Node.js 25.7 or later
      - uses: ./credscope/.github/actions/setup
        with:
          node-version: "26"

      - name: Build the executable
        run: pnpm build:binary

      - name: Check the executable
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(./dist-binary/credscope --version)"
          if [ "v$version" != "$TAG" ]; then
            echo "The executable is version $version, but the tag is $TAG"
            exit 1
          fi
          ./dist-binary/credscope --help > /dev/null

      - name: Attach it to the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv dist-binary/credscope "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --title "$TAG" --generate-notes
          fi
