name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: credscope
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: credscope
          persist-credentials: false

      - uses: ./credscope/.github/actions/setup

      - name: Check style, types and tests
        run: pnpm ci:check

      - name: Build
        run: pnpm build

      - name: Run the command line tool
        run: node bin/credscope.mjs --version
